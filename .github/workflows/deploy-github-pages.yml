# GitHub Pages — Vite static build
#
# REQUIRED ONCE (repo admin): enable Pages + GitHub Actions as the source, or the API returns 404:
#   Repo → Settings → Pages → "Build and deployment" → Source → GitHub Actions → Save
# Docs: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site#publishing-with-a-custom-github-actions-workflow
#
# After that, pushes to main deploy to: https://elannn-ghub.github.io/Dashboard_builder/
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: SPA fallback (GitHub Pages)
        run: cp dist/index.html dist/404.html

      # Note: we omit actions/configure-pages — it calls GET /repos/.../pages and fails with 404
      # until Settings → Pages → Source is set to "GitHub Actions". Upload + deploy do not need it.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
